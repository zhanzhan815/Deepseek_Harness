<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚽ 战术板（多赛制 · 语音版）</title>
<meta name="theme-color" content="#0b2b1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--s:1}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1d5c3d 0%, #0b2b1c 55%, #071d13 100%);
    color:#eaf6ee;display:flex;flex-direction:column;overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }
  header{background:rgba(4,20,12,.86);border-bottom:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
  .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:7px 12px}
  .row + .row{border-top:1px dashed rgba(255,255,255,.1)}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lbl{font-size:12px;color:#9fd8b6;letter-spacing:.5px;white-space:nowrap}
  button,select,input{
    font:inherit;border-radius:7px;border:1px solid rgba(255,255,255,.22);
    background:#123524;color:#eefcf3;padding:4px 10px;font-size:13px;cursor:pointer;
  }
  button:hover{background:#1b4a31}
  button.danger{color:#ffb4ac;border-color:rgba(255,120,110,.55)}
  button.danger:hover{background:#4a1c18}
  button.ghost{background:transparent}
  select{background:#123524}
  .seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px;gap:2px}
  .seg button{border:none;background:transparent;padding:3px 9px;border-radius:6px}
  .seg button.active{background:#fff;color:#0b3d26;font-weight:700}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}
  .dot.home{background:#e0443e}.dot.away{background:#3f83f8}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chk input{accent-color:#7fd9a4;width:14px;height:14px;cursor:pointer}
  #voiceBtn.on{background:#22c55e;color:#062b14;font-weight:700;border-color:#22c55e}
  #vstate{font-size:12px;color:#ffd166;min-width:46px;text-align:center}
  #panel{display:none;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap;background:rgba(255,255,255,.05)}
  #panel.show{display:flex}
  #selTag{font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  #panel input[type=number]{width:58px}
  #panel input[type=text]{width:120px}
  label.in{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#cfe9d9;white-space:nowrap}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
  #board{
    position:relative;border-radius:10px;overflow:hidden;
    background:repeating-linear-gradient(90deg,#2c8a4e 0 21px,#2b8449 21px 42px),#2b8449;
    box-shadow:0 10px 34px rgba(0,0,0,.55), inset 0 0 60px rgba(0,0,0,.25);
    touch-action:none;cursor:grab;
  }
  #pitchSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #players{position:absolute;inset:0}
  #linesSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #flySvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
  .chip{
    position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
    width:calc(44px * var(--s,1));height:calc(44px * var(--s,1));touch-action:none;cursor:grab;z-index:2;
  }
  .chip .ring{
    width:calc(34px * var(--s,1));height:calc(34px * var(--s,1));border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:calc(14px * var(--s,1));font-family:Verdana,Arial,sans-serif;
    border:calc(2px * var(--s,1)) solid rgba(255,255,255,.9);
    box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 0 4px rgba(0,0,0,.25);
  }
  .chip.home .ring{background:linear-gradient(180deg,#ea5149,#c93430)}
  .chip.away .ring{background:linear-gradient(180deg,#4e96ff,#2f6fd8)}
  .chip .nm{
    margin-top:calc(1px * var(--s,1));font-size:calc(11.5px * var(--s,1));line-height:1.2;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);
    background:rgba(0,0,0,.5);padding:0 calc(5px * var(--s,1));border-radius:calc(8px * var(--s,1));white-space:nowrap;
    max-width:calc(100px * var(--s,1));overflow:hidden;text-overflow:ellipsis;
  }
  .chip.sel .ring{transform:scale(1.14);box-shadow:0 0 0 3px #ffd93b,0 3px 10px rgba(0,0,0,.6)}
  .chip.draft .ring{box-shadow:0 0 0 3px #ffd93b,0 0 0 6px rgba(255,217,59,.35)}
  .chip:active{cursor:grabbing}
  .chip.moving,.ball.moving{transition:left .78s linear, top .78s linear}
  .chip.flash .ring{animation:flashRing 1s ease-out}
  @keyframes flashRing{
    0%{box-shadow:0 0 0 0 rgba(255,217,59,.95)}
    75%{box-shadow:0 0 0 16px rgba(255,217,59,0)}
    100%{box-shadow:0 0 0 0 rgba(255,217,59,0)}
  }
  .ball{
    position:absolute;transform:translate(-50%,-50%);width:calc(30px * var(--s,1));height:calc(30px * var(--s,1));
    display:flex;align-items:center;justify-content:center;
    z-index:3;touch-action:none;cursor:grab;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
  }
  .ball svg{width:calc(27px * var(--s,1));height:calc(27px * var(--s,1));pointer-events:none;display:block}
  /* 竖版球场：整板旋转 90°，球员/足球文字反向转回正立 */
  #board.v{transform:rotate(90deg)}
  #board.v .chip{transform:translate(-50%,-50%) rotate(-90deg)}
  #board.v .ball{transform:translate(-50%,-50%) rotate(-90deg)}
  .tmpFade{animation:tmpFade .95s ease forwards}
  @keyframes tmpFade{from{opacity:1}to{opacity:0}}
  footer{text-align:center;font-size:12px;color:#8fbea2;padding:5px;background:rgba(4,20,12,.6)}
  #status{
    position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(8px);
    background:rgba(6,26,16,.95);border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:99;max-width:82vw;text-align:center;
  }
  #status.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 桌面/宽屏下顶栏常驻；编辑面板独立于顶栏成一条全宽横条 */
  #panel{
    display:none;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap;
    background:rgba(4,20,12,.9);border-bottom:1px solid rgba(255,255,255,.12);
  }
  #panel.show{display:flex}
  /* 手机悬浮快捷栏（默认只在窄屏显示） */
  #mobileBar{
    position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    z-index:60;display:none;gap:6px;padding:5px;
    background:rgba(4,20,12,.82);border:1px solid rgba(255,255,255,.22);
    border-radius:12px;backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  #mobileBar button{
    width:42px;height:42px;font-size:19px;display:flex;align-items:center;justify-content:center;
    padding:0;border-radius:9px;
  }
  #mobileBar button.on{background:#22c55e;color:#062b14}
  @media (max-width: 780px){
    /* 顶栏默认收起：悬浮在上方，点 ☰ 展开 */
    header{
      position:fixed;top:0;left:0;right:0;z-index:50;
      transform:translateY(-103%);transition:transform .25s ease;
      max-height:64vh;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.45);
      padding-top:env(safe-area-inset-top,0px);
    }
    header.show{transform:translateY(0)}
    #mobileBar{display:flex}
    /* 菜单展开时，悬浮栏下移，避免挡住顶栏内容 */
    body.menuOpen #mobileBar{top:calc(64vh + 8px + env(safe-area-inset-top,0px))}
    body.menuOpen #mobileBar button{box-shadow:0 2px 8px rgba(0,0,0,.5)}
    main{padding:60px 8px 10px}
    /* 球员编辑面板：底部浮层，不随顶栏隐藏 */
    #panel{
      position:fixed;left:8px;right:8px;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:80;
      border-radius:12px;border:1px solid rgba(255,255,255,.22);
      justify-content:center;
    }
    footer{display:none}
    #status{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  }
</style>
</head>
<body>
<div id="mobileBar" aria-label="快捷操作">
  <button id="mMenuBtn" title="展开/收起控制栏">☰</button>
  <button id="mVoiceBtn" title="语音控制">🎤</button>
  <button id="mBallBtn" title="显示/隐藏足球">⚽</button>
  <button id="mRotBtn" title="切换横版/竖版球场">⇄</button>
  <button id="mFullBtn" title="全屏">⛶</button>
</div>
<header id="topbar">
  <div class="row">
    <div class="grp">
      <span class="lbl">赛制</span>
      <div class="seg" id="fmtSeg">
        <button data-fmt="11" class="active">11人制</button>
        <button data-fmt="8">8人制</button>
        <button data-fmt="5">5人制</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">队伍</span>
      <div class="seg" id="teamSeg">
        <button data-team="home" class="active"><span class="dot home"></span>主队</button>
        <button data-team="away"><span class="dot away"></span>客队</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">队形</span>
      <select id="fmSel"></select>
      <button id="addBtn" title="本方半场加一名球员">＋球员</button>
      <button id="clearTeamBtn" class="ghost danger">清空本方</button>
    </div>
    <div class="grp">
      <span class="lbl">连线</span>
      <button id="clearLinesBtn" class="ghost" title="清除所有画好的线">清除连线</button>
    </div>
    <div class="grp">
      <span class="lbl">语音</span>
      <button id="voiceBtn" title="点一下开始听，再说“8号传给10号”之类指令">🎤 语音控制</button>
      <span id="vstate"></span>
    </div>
    <div class="grp">
      <label class="chk"><input type="checkbox" id="showNames" checked> 名字</label>
      <label class="chk"><input type="checkbox" id="showBall"> ⚽ 球</label>
      <button id="flipBtn" class="ghost">换边</button>
      <button id="resetBtn" class="ghost danger">重置本赛制</button>
    </div>
  </div>
</header>

<div id="panel">
  <span id="selTag"></span>
  <label class="in">号码 <input type="number" id="inpNum" min="1" max="99"></label>
  <label class="in">名字 <input type="text" id="inpName" maxlength="12" placeholder="球员姓名"></label>
  <button id="delBtn" class="danger">删除</button>
  <button id="cancelSel" class="ghost">取消选中</button>
</div>

<main id="stage">
  <div id="board">
    <svg id="pitchSvg" preserveAspectRatio="xMidYMid meet"></svg>
    <svg id="linesSvg"></svg>
    <div id="players"></div>
    <svg id="flySvg"></svg>
  </div>
</main>

<footer>
  语音示例：“8号传给10号”“9号向前跑20米”“客队7号向左跑10米”“10号回位”“换边” · 也可喊球员名字，如“张三带球向前跑20米”（同音字可容错）· 识别建议用 Chrome / Edge
</footer>
<div id="status"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const LS_KEY = "tactics_board_v2";
const TEAM_COLORS = { home: "#ff5a5a", away: "#5ca6ff" };
const U = 10; // 每米对应的像素

// 场地参数（米）
const PITCHES = {
  "11": { L: 105, W: 68,  gw: 7.32, spot: 11, boxD: 16.5, boxW: 40.32, sixD: 5.5, sixW: 18.32,
          arc: 9.15, cr: 9.15, sec: null, corner: 1,    gd: 15 },
  "8":  { L: 60,  W: 40,  gw: 5,    spot: 9,  boxD: 12,   boxW: 30,    sixD: 4,   sixW: 16,
          arc: 8,    cr: 5,    sec: null, corner: 0.9,  gd: 12 },
  "5":  { L: 40,  W: 20,  gw: 3,    spot: 6,  boxD: 6,    boxW: 12,    sixD: null, sixW: null,
          arc: null, cr: 0,    sec: 10,   corner: 0.3,  gd: 9 }
};

// 各赛制阵型：0号槽=门将；坐标 = 场地百分比（主队左→右进攻）
const FORM_DATA = {
  "11": {
    def: "4-4-2", opts: ["4-4-2","4-3-3","4-2-3-1","4-1-2-1-2","4-5-1","3-5-2","3-4-3","5-3-2"],
    sets: {
      "4-4-2":     [[1.5,50],[12,17],[11,36],[11,64],[12,83],[26,15],[25,36],[25,64],[26,85],[40,33],[40,67]],
      "4-3-3":     [[1.5,50],[12,17],[11,36],[11,64],[12,83],[27,28],[27,50],[27,72],[39,17],[42,50],[39,83]],
      "4-2-3-1":   [[1.5,50],[12,17],[11,36],[11,64],[12,83],[27,30],[27,70],[34,17],[33,50],[33,83],[44,50]],
      "4-1-2-1-2": [[1.5,50],[12,17],[11,36],[11,64],[12,83],[27,50],[26,26],[26,74],[34,50],[43,33],[43,67]],
      "4-5-1":     [[1.5,50],[12,17],[11,36],[11,64],[12,83],[26,14],[25,32],[24,50],[25,68],[26,86],[40,50]],
      "3-5-2":     [[1.5,50],[11,20],[10,50],[11,80],[25,10],[25,32],[24,50],[25,68],[25,90],[39,34],[39,66]],
      "3-4-3":     [[1.5,50],[11,17],[9,50],[11,83],[25,22],[23,41],[23,59],[25,78],[38,20],[36,50],[38,80]],
      "5-3-2":     [[1.5,50],[11,12],[9,28],[8,50],[9,72],[11,88],[24,32],[23,50],[24,68],[37,33],[37,66]]
    }
  },
  "8": {
    def: "2-3-2", opts: ["2-3-2","3-2-2","3-3-1","2-2-3"],
    sets: {
      "2-3-2": [[2,50],[16,25],[15,75],[34,15],[33,50],[34,85],[52,32],[51,68]],
      "3-2-2": [[2,50],[14,17],[13,50],[14,83],[30,28],[29,72],[46,30],[45,70]],
      "3-3-1": [[2,50],[14,17],[13,50],[14,83],[32,20],[31,50],[32,80],[50,50]],
      "2-2-3": [[2,50],[16,25],[15,75],[34,30],[33,70],[46,24],[45,50],[46,76]]
    }
  },
  "5": {
    def: "1-2-1", opts: ["2-2","1-2-1","1-3"],
    sets: {
      "2-2":   [[2,50],[14,25],[14,75],[36,25],[36,75]],
      "1-2-1": [[2,50],[14,50],[26,25],[26,75],[40,50]],
      "1-3":   [[2,50],[14,50],[30,20],[29,50],[30,80]]
    }
  }
};

const D1 = { "零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9 };
function cnToNum(s){
  if (/^\d{1,2}$/.test(s)) return parseInt(s, 10);
  const m = /^(?:([一二两三四五六七八九])?十)?([一二两三四五六七八九])?$/.exec(s.replace(/^零+/, ""));
  if (!m) return NaN;
  const tens = m[1] ? D1[m[1]] * 10 : (s.indexOf("十") >= 0 ? 10 : 0);
  return tens + (m[2] ? D1[m[2]] : 0);
}

/* ================= 状态 ================= */
let fmt = "11";
const store = {};                    // fmt -> {players, annotations, ball, lastFm}
let players = [], annotations = [], ball = { x: 50, y: 50, show: false };
let lastFm = { home: "4-4-2", away: "4-4-2" };
let selectedId = null, lineDraft = null, activeTeam = "home";
let drag = null, animBusy = false, seq = 1000, UI_S = 1;
let isVertical = false, orientManual = false;

const $ = s => document.querySelector(s);
const numOf = p => { const n = Number(p.num); return Number.isFinite(n) && n > 0 ? n : 99; };
const byNum = (a, b) => numOf(a) - numOf(b);
const newId = () => "p" + (seq++);
const delay = ms => new Promise(r => setTimeout(r, ms));

const boardEl = $("#board"), stageEl = $("#stage"), playersEl = $("#players"),
      pitchSvg = $("#pitchSvg"), linesSvg = $("#linesSvg"), flySvg = $("#flySvg"),
      panel = $("#panel"), selTag = $("#selTag"), inpNum = $("#inpNum"), inpName = $("#inpName"),
      showNamesChk = $("#showNames"), showBallChk = $("#showBall"), fmSel = $("#fmSel"),
      statusEl = $("#status"), voiceBtn = $("#voiceBtn"), vstate = $("#vstate");

/* ================= 场地几何 ================= */
const PITCH = () => PITCHES[fmt];
const pitchTotalW = () => PITCH().L * U + 2 * PITCH().gd;
const leftMarginFrac = () => PITCH().gd / pitchTotalW();
const pitchXToBoardPct = x => (x / 100 * (1 - 2 * leftMarginFrac()) + leftMarginFrac()) * 100;
const boardPctToPitchX = b => (b / 100 - leftMarginFrac()) / (1 - 2 * leftMarginFrac()) * 100;
const clampX = v => Math.min(99, Math.max(1, v));
const clampY = v => Math.min(98, Math.max(2, v));

function buildPitch(){
  const c = PITCH(), gd = c.gd;
  const L = c.L * U, W = c.W * U, cx = L / 2, cy = W / 2;
  const f = v => (v * U).toFixed(1);
  const boxT = f((c.W - c.boxW) / 2), boxH = f(c.boxW), boxD = f(c.boxD);
  const sixT = c.sixW == null ? null : f((c.W - c.sixW) / 2);
  const sixH = c.sixW == null ? null : f(c.sixW), sixD = c.sixD == null ? null : f(c.sixD);
  const gT = f((c.W - c.gw) / 2), gH = f(c.gw);
  const sp = f(c.spot), rA = c.arc == null ? null : f(c.arc), R = f(c.corner);
  const sv = "stroke=\"#fff\" fill=\"none\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\"";
  const out = [];

  // 左右两半各自成图：s = -1 左（向里画 x 增），s = +1 右
  for (const s of [-1, 1]) {
    const near = s < 0;
    const bx = near ? 0 : L - c.boxD * U;
    const sixX = near ? 0 : L - c.sixD * U;
    const spotX = near ? c.spot * U : L - c.spot * U;
    const clipID = "clip" + (near ? "L" : "R");
    out.push(`<rect x="${bx}" y="${boxT}" width="${boxD}" height="${boxH}"/>`);
    if (c.sixW != null) out.push(`<rect x="${sixX}" y="${sixT}" width="${sixD}" height="${sixH}"/>`);
    if (c.arc != null) {
      const visX = near ? c.boxD * U : 0;
      const visW = near ? L - c.boxD * U : L - c.boxD * U;
      out.push(`<clipPath id="${clipID}"><rect x="${visX}" y="0" width="${visW}" height="${W}"/></clipPath>`);
      out.push(`<circle cx="${spotX}" cy="${cy}" r="${rA}" clip-path="url(#${clipID})"/>`);
    }
    out.push(`<rect x="${near ? -gd : L}" y="${gT}" width="${gd}" height="${gH}" fill="rgba(255,255,255,.16)"/>`);
  }
  // 角旗弧（朝场内）
  out.push(`<path d="M 0 ${R} A ${R} ${R} 0 0 0 ${R} 0"/>`);
  out.push(`<path d="M ${(L - c.corner * U).toFixed(1)} 0 A ${R} ${R} 0 0 0 ${L} ${R}"/>`);
  out.push(`<path d="M 0 ${(W - c.corner * U).toFixed(1)} A ${R} ${R} 0 0 1 ${R} ${W}"/>`);
  out.push(`<path d="M ${(L - c.corner * U).toFixed(1)} ${W} A ${R} ${R} 0 0 1 ${L} ${(W - c.corner * U).toFixed(1)}"/>`);

  const strokeGrp = out.map(x => x);
  pitchSvg.setAttribute("viewBox", `${-gd} 0 ${L + 2 * gd} ${W}`);
  pitchSvg.innerHTML =
    `<g ${sv}>` +
      `<rect x="0" y="0" width="${L}" height="${W}"/>` +
      `<line x1="${cx}" y1="0" x2="${cx}" y2="${W}"/>` +
      (c.cr > 0 ? `<circle cx="${cx}" cy="${cy}" r="${f(c.cr)}"/>` : "") +
      strokeGrp.join("") +
    `</g>` +
    `<g fill="#fff">` +
      `<circle cx="${cx}" cy="${cy}" r="5"/>` +
      `<circle cx="${f(c.spot)}" cy="${cy}" r="3.4"/>` +
      `<circle cx="${(L - c.spot * U).toFixed(1)}" cy="${cy}" r="3.4"/>` +
      (c.sec != null
        ? `<circle cx="${f(c.sec)}" cy="${cy}" r="2.6"/><circle cx="${(L - c.sec * U).toFixed(1)}" cy="${cy}" r="2.6"/>`
        : "") +
    `</g>`;
  boardEl.style.aspectRatio = pitchTotalW() + " / " + (c.W * U);
}

/* ================= 状态存取 ================= */
function snapshot(){
  return {
    players: players.slice(),
    annotations: annotations.slice(),
    ball: Object.assign({}, ball),
    lastFm: Object.assign({}, lastFm)
  };
}
function stash(){ store[fmt] = snapshot(); }
function restoreState(){
  const s = store[fmt];
  players = s.players; annotations = s.annotations; ball = s.ball; lastFm = s.lastFm;
  selectedId = null; lineDraft = null;
}
function saveAll(){
  stash();
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ fmt, seq, store }));
  } catch (e) {}
}

function defaultPopulate(f){
  const d = FORM_DATA[f].def;
  players = []; annotations = [];
  ball = { x: 50, y: 50, show: false };
  lastFm = { home: d, away: d };
  selectedId = null; lineDraft = null;
  setActiveTeam("home"); applyFormation("home", d);
  setActiveTeam("away"); applyFormation("away", d);
  setActiveTeam("home");
  store[f] = snapshot();
}

/* ================= 阵型 ================= */
function slotsFor(team, f){
  const set = FORM_DATA[fmt].sets[f];
  if (!set) return null;
  return team === "home" ? set : set.map(([x, y]) => [100 - x, y]);
}
function applyFormation(team, f){
  const slots = slotsFor(team, f);
  if (!slots) return;
  const mine = players.filter(p => p.team === team).sort(byNum);
  let maxN = mine.reduce((m, p) => Math.max(m, numOf(p)), 0);
  mine.forEach((p, i) => { if (i < slots.length) { p.x = slots[i][0]; p.y = slots[i][1]; } });
  for (let i = mine.length; i < slots.length; i++) {
    maxN = Math.min(99, maxN + 1);
    players.push({ id: newId(), team, x: slots[i][0], y: slots[i][1], num: maxN, name: "" });
  }
  if (selectedId && !players.some(p => p.id === selectedId)) selectedId = null;
  if (lineDraft && !players.some(p => p.id === lineDraft)) lineDraft = null;
  lastFm[team] = f;
  fmSel.value = f;
  renderPlayers(); refreshLines();
}
function addPlayer(team){
  const maxN = players.filter(p => p.team === team).reduce((m, p) => Math.max(m, numOf(p)), 0);
  players.push({ id: newId(), team, x: team === "home" ? 20 : 80, y: 50, num: Math.min(99, maxN + 1), name: "" });
  renderPlayers();
}
function clearTeam(team){
  players = players.filter(p => p.team !== team);
  // 仅保留“起点还在场”的连线：终点可能是球员或固定目标点
  annotations = annotations.filter(an => players.some(p => p.id === an.a)
    && (typeof an.b === "string" ? players.some(p => p.id === an.b)
        : !!(an.b && Number.isFinite(an.b.x) && Number.isFinite(an.b.y))));
  if (selectedId && !players.some(p => p.id === selectedId)) selectedId = null;
  if (lineDraft && !players.some(p => p.id === lineDraft)) lineDraft = null;
  renderPlayers(); refreshLines();
}
function resetToSlots(scope){
  const teams = scope === "all" ? ["home", "away"] : [scope];
  for (const t of teams) {
    const slots = slotsFor(t, lastFm[t]);
    if (!slots) continue;
    const mine = players.filter(p => p.team === t).sort(byNum);
    mine.forEach((p, i) => { if (i < slots.length) { p.x = slots[i][0]; p.y = slots[i][1]; } });
  }
  renderPlayers(); refreshLines();
}
function flipSides(){
  for (const p of players) p.x = 100 - p.x;
  ball.x = 100 - ball.x;
  for (const an of annotations) if (typeof an.b !== "string") an.b.x = 100 - an.b.x;
  renderPlayers(); refreshLines();
}

/* ================= 渲染 ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function chipStyle(p){ return `left:${pitchXToBoardPct(p.x).toFixed(3)}%;top:${p.y.toFixed(3)}%;`; }

// 经典黑白足球（五边形拼接图案）
function pentPts(cx, cy, r, rot){
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = rot + i * Math.PI * 2 / 5;
    pts.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}
function ballShapes(){
  const parts = ['<circle cx="13" cy="13" r="12.1" fill="url(#bgrad)"/>'];
  parts.push(`<polygon points="${pentPts(13, 13, 4.7, -Math.PI / 2)}" fill="#14141a"/>`);
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + k * Math.PI * 2 / 5;
    const px = 13 + 8.8 * Math.cos(a), py = 13 + 8.8 * Math.sin(a);
    parts.push(`<polygon points="${pentPts(px, py, 3.4, a)}" fill="#14141a"/>`);
  }
  return parts.join("");
}
const BALL_SHAPES = ballShapes();
const BALL_SVG = `<svg viewBox="0 0 26 26">${BALL_SHAPES}</svg>`;

function renderPlayers(){
  playersEl.innerHTML = "";
  for (const p of players) {
    const el = document.createElement("div");
    el.className = "chip " + p.team
      + (p.id === selectedId ? " sel" : "")
      + (p.id === lineDraft ? " draft" : "");
    el.dataset.id = p.id;
    el.setAttribute("style", chipStyle(p));
    const nm = showNamesChk.checked && p.name ? `<div class="nm">${esc(p.name)}</div>` : "";
    el.innerHTML = `<div class="ring">${esc(p.num)}</div>${nm}`;
    playersEl.appendChild(el);
  }
  if (ball.show) {
    const b = document.createElement("div");
    b.className = "ball";
    b.setAttribute("style", chipStyle(ball));
    b.innerHTML = BALL_SVG;
    playersEl.appendChild(b);
  }
  syncPanel();
}
function syncPanel(){
  const p = players.find(x => x.id === selectedId);
  panel.classList.toggle("show", !!p);
  if (p) {
    selTag.innerHTML = `<span class="dot ${p.team}"></span>${p.team === "home" ? "主队" : "客队"} 球员`;
    inpNum.value = p.num;
    inpName.value = p.name || "";
  }
}
function syncChipVisual(p){
  const el = playersEl.querySelector(`.chip[data-id="${p.id}"]`);
  if (!el) return;
  const ring = el.querySelector(".ring");
  if (ring) ring.textContent = p.num;
  let nm = el.querySelector(".nm");
  if (showNamesChk.checked && p.name) {
    if (!nm) { nm = document.createElement("div"); nm.className = "nm"; el.appendChild(nm); }
    nm.textContent = p.name;
  } else if (nm) { nm.remove(); }
}
function syncDraftMark(){
  playersEl.querySelectorAll(".chip.draft").forEach(el => el.classList.remove("draft"));
  if (lineDraft) {
    const el = playersEl.querySelector(`.chip[data-id="${lineDraft}"]`);
    if (el) el.classList.add("draft");
  }
}
function endpointAlive(an, byId){
  if (!an || !byId.has(an.a)) return false;
  if (typeof an.b === "string") return byId.has(an.b);
  return !!(an.b && Number.isFinite(an.b.x) && Number.isFinite(an.b.y));
}
// 箭头符号定义（放在线条所在 SVG 内部，避免跨 SVG 引用失败）
function markerDefsMarkup(){
  const mk = (id, color) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">` +
    `<path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>`;
  return `<defs>${mk("mhome", TEAM_COLORS.home)}${mk("maway", TEAM_COLORS.away)}</defs>`;
}
// 把线段两端各收短 r 像素，让箭头露在队徽圆片外面
function trimLine(ax, ay, bx, by, r){
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  return { x1: ax + ux * r, y1: ay + uy * r, x2: bx - ux * r, y2: by - uy * r };
}
function refreshLines(){
  const W = boardEl.clientWidth, H = boardEl.clientHeight;
  if (!W) return;
  linesSvg.innerHTML = markerDefsMarkup();
  const ns = "http://www.w3.org/2000/svg";
  const byId = new Map(players.map(p => [p.id, p]));
  annotations = annotations.filter(an => endpointAlive(an, byId));
  const clip = 18 * UI_S;
  for (const an of annotations) {
    const A = byId.get(an.a);
    const isPlayer = typeof an.b === "string";
    const B = isPlayer ? byId.get(an.b) : an.b;
    const ax = pitchXToBoardPct(A.x) / 100 * W, ay = A.y / 100 * H;
    const bx = pitchXToBoardPct(B.x) / 100 * W, by2 = B.y / 100 * H;
    let t;
    if (isPlayer) {
      t = trimLine(ax, ay, bx, by2, clip);
    } else {
      // 终点是空位：只把起点收到队徽边缘，箭尖直达目标点
      const dx = bx - ax, dy = by2 - ay;
      const len = Math.hypot(dx, dy) || 1;
      t = { x1: ax + dx / len * clip, y1: ay + dy / len * clip, x2: bx, y2: by2 };
    }
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", t.x1); l.setAttribute("y1", t.y1);
    l.setAttribute("x2", t.x2); l.setAttribute("y2", t.y2);
    l.setAttribute("stroke", TEAM_COLORS[an.team]);
    l.setAttribute("stroke-width", an.type === "run" ? 2.2 : 3);
    if (an.type === "run") l.setAttribute("stroke-dasharray", "8 6");
    l.setAttribute("marker-end", `url(#m${an.team})`);
    linesSvg.appendChild(l);
    // 固定目标点（空位）加个“靶心”记号
    if (!isPlayer) {
      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", bx); ring.setAttribute("cy", by2);
      ring.setAttribute("r", 5 * UI_S);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", TEAM_COLORS[an.team]);
      ring.setAttribute("stroke-width", "1.8");
      linesSvg.appendChild(ring);
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", bx); dot.setAttribute("cy", by2);
      dot.setAttribute("r", 1.7 * UI_S);
      dot.setAttribute("fill", TEAM_COLORS[an.team]);
      linesSvg.appendChild(dot);
    }
  }
}
function pctPx(p){
  return {
    x: pitchXToBoardPct(p.x) / 100 * boardEl.clientWidth,
    y: p.y / 100 * boardEl.clientHeight
  };
}
function setPos(kind, id, x, y){
  if (kind === "player") {
    const p = players.find(q => q.id === id);
    if (!p) return;
    p.x = clampX(x); p.y = clampY(y);
    const el = playersEl.querySelector(`.chip[data-id="${id}"]`);
    if (el) el.setAttribute("style", chipStyle(p));
  } else {
    ball.x = clampX(x); ball.y = clampY(y);
    const b = playersEl.querySelector(".ball");
    if (b) b.setAttribute("style", chipStyle(ball));
  }
  refreshLines();
}

/* ================= 选择 / 连线 ================= */
function select(id){
  selectedId = id;
  renderPlayers();
  if (id) syncPanel();
}
function cancelDraft(){ lineDraft = null; syncDraftMark(); }
function chipTap(id){
  // 免模式交互：点一名球员=选中并“预备”；点第二名球员=传球；点空白处=跑位
  if (!lineDraft) {
    lineDraft = id; select(id); syncDraftMark();
    const A = players.find(p => p.id === id);
    toast(A && A.name
      ? `已选 ${A.name}：点另一名球员=传球；点空白处=跑位（再点本球员或 Esc/右键取消）`
      : `已选 #${numOf(A)}：点另一名球员=传球；点空白处=跑位（再点本球员或 Esc/右键取消）`);
    return;
  }
  if (lineDraft === id) { cancelDraft(); toast("已取消，可点其他球员重新开始"); return; }
  const A = players.find(p => p.id === lineDraft);
  annotations.push({ a: lineDraft, b: id, team: A.team, type: "pass" });
  cancelDraft(); refreshLines(); saveAll();
  select(id);
}

/* ================= 拖拽 ================= */
function pitchFromEvent(e){
  const r = boardEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  // 竖版时整板顺时针转了 90°，指针坐标要逆旋转回局部坐标系
  const lx = isVertical ? dy : dx;
  const ly = isVertical ? -dx : dy;
  return {
    x: boardPctToPitchX(lx / boardEl.offsetWidth * 100),
    y: ly / boardEl.offsetHeight * 100
  };
}
boardEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const chip = e.target.closest(".chip");
  const ballEl = e.target.closest(".ball");
  let kind = null, id = null;
  if (chip) { kind = "player"; id = chip.dataset.id; chip.classList.remove("moving"); }
  else if (ballEl) kind = "ball";
  else {
    const p = pitchFromEvent(e);
    tapBackground(p.x, p.y);
    return;
  }
  drag = { kind, id, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
  try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
boardEl.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && dx * dx + dy * dy < 16) return;
  drag.moved = true;
  const p = pitchFromEvent(e);
  setPos(drag.kind, drag.id, p.x, p.y);
  e.preventDefault();
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  drag = null;
  try { boardEl.releasePointerCapture(e.pointerId); } catch (err) {}
  if (!d.moved) {
    if (d.kind === "player") chipTap(d.id);
  } else {
    if (d.kind === "player" && lineDraft === d.id) cancelDraft();
    refreshLines(); saveAll();
  }
}
boardEl.addEventListener("pointerup", endDrag);
boardEl.addEventListener("pointercancel", endDrag);
boardEl.addEventListener("contextmenu", e => { e.preventDefault(); cancelDraft(); });
function tapBackground(px, py){
  // 已选球员后再点空白 = 跑位到该空位（虚线）
  if (lineDraft && Number.isFinite(px) && Number.isFinite(py)) {
    const A = players.find(p => p.id === lineDraft);
    if (A) {
      annotations.push({ a: lineDraft, b: { x: clampX(px), y: clampY(py) }, team: A.team, type: "run" });
      cancelDraft(); refreshLines(); saveAll();
      toast(`#${numOf(A)} 跑位至空位 ✓`);
      return;
    }
  }
  select(null);
}
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "Delete" || e.key === "Backspace") { if (selectedId) $("#delBtn").click(); }
  else if (e.key === "Escape") { if (lineDraft) cancelDraft(); else select(null); }
});

/* ================= 动画与指令执行 ================= */
function flashChip(id){
  const el = playersEl.querySelector(`.chip[data-id="${id}"]`);
  if (!el) return;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1150);
}
function tempLine(ax, ay, bx, by, team, dash, dur){
  const ns = "http://www.w3.org/2000/svg";
  const l = document.createElementNS(ns, "line");
  l.setAttribute("x1", ax); l.setAttribute("y1", ay);
  l.setAttribute("x2", bx); l.setAttribute("y2", by);
  l.setAttribute("stroke", TEAM_COLORS[team]);
  l.setAttribute("stroke-width", dash ? 2 : 2.8);
  if (dash) l.setAttribute("stroke-dasharray", "8 6");
  l.setAttribute("marker-end", dash ? "" : `url(#m${team})`);
  linesSvg.appendChild(l);
  l.classList.add("tmpFade");
  setTimeout(() => l.remove(), dur);
}
function animPass(a, b){
  return new Promise(resolve => {
    const A = pctPx(a), B = pctPx(b);
    const ns = "http://www.w3.org/2000/svg";
    const bs = 0.58 * UI_S;
    const l = document.createElementNS(ns, "line");
    const g = document.createElementNS(ns, "g");
    const mk = a.team === "home" ? "home" : "away";
    l.setAttribute("x1", A.x); l.setAttribute("y1", A.y);
    l.setAttribute("x2", A.x); l.setAttribute("y2", A.y);
    l.setAttribute("stroke", TEAM_COLORS[a.team]);
    l.setAttribute("stroke-width", 3);
    l.setAttribute("marker-end", `url(#m${mk})`);
    g.setAttribute("transform", `translate(${A.x} ${A.y}) scale(${bs})`);
    g.innerHTML = BALL_SHAPES;
    flySvg.appendChild(l); flySvg.appendChild(g);
    const dur = 800, t0 = performance.now();
    function frame(now){
      const k = Math.min(1, (now - t0) / dur);
      const x = A.x + (B.x - A.x) * k, y = A.y + (B.y - A.y) * k;
      l.setAttribute("x2", x); l.setAttribute("y2", y);
      g.setAttribute("transform", `translate(${x} ${y}) scale(${bs})`);
      if (k < 1) requestAnimationFrame(frame);
      else { l.remove(); g.remove(); resolve(); }
    }
    requestAnimationFrame(frame);
  });
}
function movePlayerAnim(p, dx, dy, carry){
  const el = playersEl.querySelector(`.chip[data-id="${p.id}"]`);
  const sx = p.x, sy = p.y;
  const nx = clampX(sx + dx), ny = clampY(sy + dy);
  p.x = nx; p.y = ny;
  let bEl = null;
  if (carry) {
    if (!ball.show) { ball.show = true; showBallChk.checked = true; }
    ball.x = sx; ball.y = sy;                       // 球先“拿”到球员脚下
    bEl = playersEl.querySelector(".ball");
    if (!bEl) {
      bEl = document.createElement("div");
      bEl.className = "ball";
      bEl.innerHTML = BALL_SVG;
      playersEl.appendChild(bEl);
    }
    bEl.classList.remove("moving");
    bEl.setAttribute("style", chipStyle(ball));
  }
  if (el) {
    const a = pctPx({ x: sx, y: sy }), b = pctPx({ x: nx, y: ny });
    tempLine(a.x, a.y, b.x, b.y, p.team, true, 950);
    el.classList.add("moving");
    el.setAttribute("style", chipStyle(p));
  }
  if (carry && bEl) {
    ball.x = nx; ball.y = ny;                       // 带球推进：球与人同步到达
    void bEl.offsetWidth;
    bEl.classList.add("moving");
    bEl.setAttribute("style", chipStyle(ball));
  }
  setTimeout(() => {
    if (el) el.classList.remove("moving");
    if (bEl) bEl.classList.remove("moving");
    refreshLines();
  }, 860);
}

function whoLabel(ref){
  if (!ref) return "选中球员";
  if (ref.id) {
    const p = players.find(x => x.id === ref.id);
    if (p) return `#${p.num}${p.name ? "(" + p.name + ")" : ""}`;
  }
  return ref.num != null ? `#${ref.num}` : "球员";
}
function resolveRef(ref, preferTeam){
  if (!ref) return null;
  if (ref.id) return players.find(p => p.id === ref.id) || null;
  let cs = players.filter(p => numOf(p) === ref.num);
  if (!cs.length) return null;
  const want = ref.team || preferTeam || null;
  if (want) {
    const f = cs.filter(p => p.team === want);
    if (f.length) return f[0];
  }
  if (cs.length === 1) return cs[0];
  return cs.find(p => p.team === "home") || cs[0];
}
function describe(a){
  switch (a.type) {
    case "pass":  return `⚽ ${a.a == null ? "选中球员" : whoLabel(a.a)} → ${whoLabel(a.b)} 传球`;
    case "run":   return `🏃 ${whoLabel(a.who)} ${a.carry ? "带球" : ""}${a.dir}跑 ${a.dist} 米`;
    case "resetPlayer": return `↩️ ${whoLabel(a.who)} 回位`;
    case "reset": return "↩️ 全体回位";
    case "flip":  return "🔄 换边";
    case "clearLines": return "🧹 已清除连线";
    default: return "";
  }
}
async function runCommand(a){
  if (a.type === "pass") {
    const src = a.a == null ? (players.find(p => p.id === selectedId) || null) : resolveRef(a.a);
    const tgt = resolveRef(a.b, src ? src.team : null);
    if (!src) return toast("找不到传球人：请先点选源球员，或说出号码/名字");
    if (!tgt) return toast(`没找到接应球员 ${whoLabel(a.b)}`);
    if (src.id === tgt.id) return toast("传球双方不能是同一人");
    await animPass(src, tgt);
    flashChip(tgt.id);
    // 语音传球：自动在板上留下一道实线记录
    annotations.push({ a: src.id, b: tgt.id, team: src.team, type: "pass" });
    if (ball.show) { ball.x = tgt.x; ball.y = tgt.y; renderPlayers(); }
    refreshLines(); saveAll();
  } else if (a.type === "run") {
    const p = resolveRef(a.who);
    if (!p) return toast(`没找到球员 ${whoLabel(a.who)}`);
    const c = PITCH();
    const fx = p.team === "home" ? 1 : -1;
    let vx = 0, vy = 0;
    if (/(向前|往前|前插|前压|推进|插上)/.test(a.dir)) { vx = fx; }
    else if (/(向后|往后|后撤|回撤|后退)/.test(a.dir)) { vx = -fx; }
    else if (/(向左|往左)/.test(a.dir)) { vy = -fx; }
    else if (/(向右|往右)/.test(a.dir)) { vy = fx; }
    else { vx = fx; }
    movePlayerAnim(p, vx * a.dist / c.L * 100, vy * a.dist / c.W * 100, !!a.carry);
    await delay(950);
    saveAll();
  } else if (a.type === "resetPlayer") {
    const p = resolveRef(a.who);
    if (!p) return toast(`没找到球员 ${whoLabel(a.who)}`);
    const slots = slotsFor(p.team, lastFm[p.team]);
    const idx = players.filter(q => q.team === p.team).sort(byNum).indexOf(p);
    if (slots && idx >= 0 && idx < slots.length) { p.x = slots[idx][0]; p.y = slots[idx][1]; }
    renderPlayers(); refreshLines(); saveAll();
  } else if (a.type === "reset") {
    resetToSlots(a.team || "all"); saveAll();
  } else if (a.type === "flip") { flipSides(); saveAll(); }
  else if (a.type === "clearLines") { annotations = []; refreshLines(); saveAll(); }
}

/* ================= 指令解析（号码 + 名字） ================= */
function normText(t){ return String(t || "").replace(/[\s，。、！？；;,.!?]/g, ""); }
function hintTeam(s){
  if (/(主队|红队|红方|本方|我方|我们|自己|咱们)/.test(s)) return "home";
  if (/(客队|蓝队|蓝方|对方|对面|敌队|他们|白队)/.test(s)) return "away";
  return null;
}
// 编辑距离（小字符串够用）
function lev(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = new Array(n + 1);
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
// 按出现顺序提取“球员指代”：名字（含同音容错）或 号码+号（如 8号/八）
function extractMentions(text, preferTeam){
  const named = players
    .filter(p => p.name && p.name.length)
    .sort((x, y) => y.name.length - x.name.length);
  const res = [];
  const numRe = /(?:\d{1,2}|[一二两三四五六七八九十]+)号?/;
  const SUFFIX = /^(带球|盘带|持球|向前|往前|前插|前压|推进|插上|向后|往后|后撤|回撤|向左|向右|往左|往右|传给|传|分给|直塞|长传|喂给|回位|归位|复位|跑|突|接|到|号|米|给|的位置)/;
  let pos = 0;
  while (pos < text.length) {
    let hit = null;
    const matches = named.filter(p => text.startsWith(p.name, pos));
    if (matches.length) {
      const maxLen = Math.max.apply(null, matches.map(m => m.name.length));
      const cands = matches.filter(m => m.name.length === maxLen);
      const best = cands.find(m => m.team === preferTeam) || cands[0];
      hit = { type: "id", player: best, len: maxLen };
    }
    if (!hit) {
      const m = numRe.exec(text.slice(pos));
      if (m && m.index === 0) {
        const v = cnToNum(m[0].replace(/号$/, ""));
        if (Number.isFinite(v) && v >= 1 && v <= 99) hit = { type: "num", num: v, len: m[0].length };
      }
    }
    if (!hit) {
      // 同音字容错：名字 vs 当前位置的近似片段（只替换，不吞后续动词）
      const rest = text.slice(pos);
      let bestF = null;
      for (const p of named) {
        const n = p.name, L = n.length;
        const maxW = Math.min(L + 1, rest.length);
        for (let w = L - 1; w <= maxW; w++) {
          if (w < 1) continue;
          const win = rest.slice(0, w);
          if (/\d/.test(win) || /米/.test(win)) continue;
          const after = rest.slice(w);
          if (after !== "" && !SUFFIX.test(after)) continue;
          const d = lev(n, win);
          const allow = L >= 4 ? 2 : L === 3 ? 1 : L === 2 ? 1 : 0;
          const ok = d <= allow && (w === L ? true : d <= allow - 1);
          if (ok && (!bestF || d < bestF.d || (d === bestF.d && p.team === preferTeam))) {
            bestF = { p, w, d };
          }
        }
      }
      if (bestF) hit = { type: "id", player: bestF.p, len: bestF.w };
    }
    if (hit) { res.push(hit); pos += hit.len; }
    else pos++;
  }
  return res;
}
function refFromMention(m, globalTeam){
  if (m.type === "id") return { id: m.player.id, team: m.player.team };
  return { num: m.num, team: globalTeam };
}
// ===== 一句话包含多条指令时（无标点粘连，如“8号传给10号9号向前跑20米”）自动切分 =====
function mentionSpans(text){
  const named = players.filter(p => p.name && p.name.length).sort((x, y) => y.name.length - x.name.length);
  const res = [];
  const numRe = /(?:\d{1,2}|[一二两三四五六七八九十]+)号?/;
  let pos = 0;
  while (pos < text.length) {
    let hit = null;
    const matches = named.filter(p => text.startsWith(p.name, pos));
    if (matches.length) {
      const maxLen = Math.max.apply(null, matches.map(m => m.name.length));
      const cands = matches.filter(m => m.name.length === maxLen);
      hit = { start: pos, end: pos + maxLen, player: cands[0] };
    }
    if (!hit) {
      const m = numRe.exec(text.slice(pos));
      if (m && m.index === 0) {
        const v = cnToNum(m[0].replace(/号$/, ""));
        if (Number.isFinite(v) && v >= 1 && v <= 99) hit = { start: pos, end: pos + m[0].length, num: v };
      }
    }
    if (hit) { res.push(hit); pos = hit.end; }
    else pos++;
  }
  return res;
}
function commandCut(s){
  // 以“换边/清线/全体回位”等开头的纯命令
  const pure = /^(换边|交换场地|交换半场|换方向|全体回位|全部回位|都回位|大家回位|回位|归位|复位|回到原位|清除?连线|清除?箭头|清除?标记|擦掉.{0,4})/.exec(s);
  if (pure && pure[0].length) return pure[0].length;
  const spans = mentionSpans(s);
  const cuts = [];
  // 候选1：单人回位（球员指代 + 回位/归位…）
  const rp = /(回位|归位|复位|回到原位)/.exec(s);
  if (rp) {
    const src = spans.filter(x => x.end <= rp.index).pop();
    if (src) cuts.push(rp.index + rp[0].length);
  }
  // 候选2：跑位（球员 + [带球] + [方向] + 距离米）
  const dm = s.match(/(\d+(?:\.\d+)?|[一二两三四五六七八九十]{1,3})米/);
  if (dm) {
    const p = spans.filter(x => x.end <= dm.index).pop();
    if (p) {
      const mid = s.slice(p.end, dm.index);
      if (/(跑|推进|前插|后撤|回撤|移动|带球|盘带|持球)/.test(mid) || /(向前|往前|前插|前压|推进|插上|向后|往后|后撤|回撤|后退|向左|往左|向右|往右)/.test(s.slice(0, dm.index))) {
        cuts.push(dm.index + dm[0].length);
      }
    }
  }
  // 候选3：传球（……传/传给……源在前目标在后）
  const pk = /传给|传一下|分给|直塞|长传|喂给|传/.exec(s);
  if (pk) {
    const kIdx = pk.index, kLen = pk[0].length;
    const src = spans.filter(x => x.end <= kIdx).pop();
    const tgt = spans.find(x => x.start >= kIdx + kLen);
    if (src && tgt) cuts.push(tgt.end);
  }
  if (!cuts.length) return null;
  let best = null;
  for (const c of cuts) if (c > 0 && (!best || c < best)) best = c;
  return best && best <= s.length ? best : null;
}
function splitVoiceCommands(t){
  const segs = [];
  let s = t;
  let guard = 0;
  while (s && guard++ < 30) {
    s = s.replace(/^(然后|接着|再|再然后|同时|并)/, "");
    if (!s) break;
    const cut = commandCut(s);
    if (!cut || cut <= 0 || cut > s.length) { segs.push(s); break; }
    segs.push(s.slice(0, cut));
    s = s.slice(cut);
  }
  return segs.filter(Boolean);
}
function parseCmd(raw){
  const s = normText(raw);
  if (!s) return { type: "none", why: "没有听到内容" };
  const team = hintTeam(s);
  if (/(换边|交换场地|交换半场|换方向)/.test(s) && !extractMentions(s, team).length) return { type: "flip" };
  if (/清除?连线|清除?箭头|清除?标记|擦掉/.test(s) && !extractMentions(s, team).length) return { type: "clearLines" };
  if (/(回位|归位|复位|回到原位)/.test(s)) {
    const ms = extractMentions(s.replace(/(回位|归位|复位|回到原位)/g, ""), team);
    if (ms.length) return { type: "resetPlayer", who: refFromMention(ms[0], team) };
    return { type: "reset", team };
  }
  const ms = extractMentions(s, team);
  if (/传给|传一下|分给|直塞|长传|喂给|传/.test(s)) {
    if (ms.length >= 2) return { type: "pass", a: refFromMention(ms[0], team), b: refFromMention(ms[1], team) };
    if (ms.length === 1 && selectedId) return { type: "pass", a: null, b: refFromMention(ms[0], team) };
    return { type: "none", why: "请说出传球双方，例如“8号传给10号”或“张三传给李四”" };
  }
  const distM = s.match(/(\d+(?:\.\d+)?|[一二两三四五六七八九十]{1,3})米/);
  const dirHit = /(向前|往前|前插|前压|推进|插上|向后|往后|后撤|回撤|后退|向左|往左|向右|往右)/.exec(s);
  const runVerb = /(跑|推进|前插|后撤|回撤|移动)/.test(s);
  if (distM && (dirHit || runVerb)) {
    const sNoDist = s.replace(distM[0], "");
    const m0 = extractMentions(sNoDist, team)[0];
    if (m0) {
      const dv = cnToNum(distM[1]);
      if (!Number.isFinite(dv)) return { type: "none", why: "距离没听清" };
      return {
        type: "run",
        who: refFromMention(m0, team),
        dist: dv,
        dir: dirHit ? dirHit[0] : "向前",
        carry: /带球|盘带|持球/.test(s)
      };
    }
  }
  return { type: "none", why: "没听懂，试试“8号传给10号”或“张三带球向前跑20米”" };
}

/* ================= 语音 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voiceOn = false, keepListen = false, lastCmd = "", lastCmdAt = 0;
function voiceUI(on){
  voiceBtn.classList.toggle("on", on);
  voiceBtn.textContent = on ? "🔴 聆听中·点击停止" : "🎤 语音控制";
  vstate.textContent = on ? "聆听中" : (SR ? "未开启" : "不支持");
  const mb = document.getElementById("mVoiceBtn");
  if (mb) {
    mb.classList.toggle("on", on);
    mb.textContent = on ? "⏹" : "🎤";
    mb.title = on ? "停止聆听" : "开始语音控制";
  }
}
function startVoice(){
  if (!SR) return toast("当前浏览器不支持语音识别：请用 Chrome 或 Edge 打开 https 页面并允许麦克风");
  if (voiceOn) { stopVoice(); return; }
  if (!rec) {
    rec = new SR();
    rec.lang = "zh-CN";
    rec.continuous = false;   // 每次识别完自动重启，避免连续模式“第二句失灵”
    rec.interimResults = false;
    rec.onresult = e => {
      let t = "";
      for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript;
      if (t) handleVoice(t.trim());
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        toast("麦克风权限被拒或服务不可用：请在浏览器地址栏左侧允许麦克风（需要 https 页面）");
        voiceOn = false; keepListen = false;
        voiceUI(false);
      }
    };
    rec.onend = () => {
      voiceOn = false;
      voiceUI(false);
      if (keepListen) setTimeout(() => {
        if (keepListen) {
          try { rec.start(); voiceOn = true; voiceUI(true); } catch (e) { voiceOn = false; voiceUI(false); }
        }
      }, 300);
    };
  }
  keepListen = true;
  try {
    rec.start();
    voiceOn = true;
    voiceUI(true);
  } catch (e) {
    voiceOn = false; keepListen = false;
    voiceUI(false);
    toast("启动语音失败：请允许麦克风后重试");
  }
}
function stopVoice(){
  voiceOn = false;
  keepListen = false;
  try { rec && rec.stop(); } catch (e) {}
  voiceUI(false);
}
voiceBtn.addEventListener("click", () => { if (voiceOn) stopVoice(); else startVoice(); });

let voicePending = "", voiceTimer = null, voicePendingAt = 0;
function allVoiceReady(s){
  if (!s) return false;
  const segs = splitVoiceCommands(s);
  return segs.length > 0 && segs.every(seg => parseCmd(seg).type !== "none");
}
// 执行 voicePending 中的指令；maxPrefix=true 时只执行开头可解析的段，尾巴保留给下一句
async function flushVoice(maxPrefix){
  const s = voicePending;
  if (!s) return;
  const segs = splitVoiceCommands(s);
  const ready = [];
  for (const seg of segs) {
    const a = parseCmd(seg);
    if (a.type === "none") {
      if (maxPrefix) break;
      voicePending = "";
      toast(a.why || "没听懂");
      return;
    }
    ready.push({ text: seg, act: a });
  }
  voicePending = segs.slice(ready.length).join("");
  for (const r of ready) {
    toast(`“${r.text}”→ ${describe(r.act)}`);
    await runCommand(r.act);
    await delay(500);
  }
}
async function handleVoice(t){
  const now = Date.now();
  if (t === lastCmd && now - lastCmdAt < 2000) return;
  lastCmd = t; lastCmdAt = now;
  if (voicePending && now - voicePendingAt > 2800) voicePending = "";  // 间隔过久 = 新一句话
  voicePending = voicePending + normText(t);
  voicePendingAt = now;
  clearTimeout(voiceTimer);
  if (allVoiceReady(voicePending)) {
    await flushVoice(false);          // 整句已能识别 → 立即执行
    voicePending = "";
    return;
  }
  voiceTimer = setTimeout(async () => {
    if (!voicePending) return;
    await flushVoice(true);           // 先执行已识别的，尾巴等下一句补齐
    if (voicePending) {
      const why = parseCmd(voicePending).why;
      voiceTimer = setTimeout(() => {
        if (voicePending) { voicePending = ""; toast(why || "没听懂"); }
      }, 1500);
    }
  }, 700);
}

function toast(msg){

  statusEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => statusEl.classList.remove("show"), 2600);

function ensureMarkers(){
  const ns = "http://www.w3.org/2000/svg";
  const defs = document.createElementNS(ns, "defs");
  const grad = document.createElementNS(ns, "radialGradient");
  grad.setAttribute("id", "bgrad");
  grad.setAttribute("cx", "0.34"); grad.setAttribute("cy", "0.3"); grad.setAttribute("r", "0.9");
  const stops = [[0, "#ffffff"], [0.55, "#ececec"], [1, "#9f9f9f"]];
  for (const [off, col] of stops) {
    const st = document.createElementNS(ns, "stop");
    st.setAttribute("offset", off);
    st.setAttribute("stop-color", col);
    grad.appendChild(st);
  }
  defs.appendChild(grad);
  for (const t of ["home", "away"]) {
    const m = document.createElementNS(ns, "marker");
    m.setAttribute("id", "m" + t);
    m.setAttribute("viewBox", "0 0 10 10");
    m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "6.5"); m.setAttribute("markerHeight", "6.5");
    m.setAttribute("orient", "auto-start-reverse");
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", "M0,0 L10,5 L0,10 z");
    path.setAttribute("fill", TEAM_COLORS[t]);
    m.appendChild(path);
    defs.appendChild(m);
  }
  flySvg.appendChild(defs);
}
function fit(){
  const pad = 22;
  const c = PITCHES[fmt];
  const ratio = (c.L * U + 2 * c.gd) / (c.W * U);
  const aw = stageEl.clientWidth - pad * 2, ah = stageEl.clientHeight - pad * 2;
  let W;
  if (isVertical) {
    // 竖版：旋转 90° 后可视宽=板高(=W/ratio)，可视高=板宽 W，需都装进舞台
    W = Math.min(aw * ratio, ah);
  } else {
    W = Math.min(aw, ah * ratio);
  }
  W = Math.max(240, W);
  boardEl.style.width = W + "px";
  const effW = isVertical ? W / ratio : W;
  UI_S = Math.max(0.55, Math.min(1.9, effW / 1150));
  document.documentElement.style.setProperty("--s", UI_S.toFixed(3));
  requestAnimationFrame(refreshLines);
}
function setOrientation(autoFollow, vert){
  orientManual = !autoFollow;
  if (autoFollow) isVertical = window.innerHeight > window.innerWidth;
  else if (vert != null) isVertical = vert;
  boardEl.classList.toggle("v", isVertical);
  const rBtn = document.getElementById("mRotBtn");
  if (rBtn) {
    rBtn.classList.toggle("on", isVertical);
    rBtn.textContent = isVertical ? "⇆" : "⇄";
  }
}
window.addEventListener("resize", () => { if (!orientManual) setOrientation(true); fit(); });

function setFormat(f){
  if (f === fmt) return;
  stash();
  fmt = f;
  if (!store[fmt]) defaultPopulate(fmt);
  restoreState();
  showBallChk.checked = !!ball.show;
  document.querySelectorAll("#fmtSeg button").forEach(b => b.classList.toggle("active", b.dataset.fmt === f));
  setFmOptions(); buildPitch(); renderPlayers(); refreshLines(); saveAll();
  requestAnimationFrame(fit);
}
$("#fmtSeg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setFormat(b.dataset.fmt);
});

function init(){
  ensureMarkers();
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && typeof d === "object" && d.store) {
        for (const k of Object.keys(d.store)) {
          const s = d.store[k];
          if (s && Array.isArray(s.players)) {
            s.players = s.players.filter(p => p && p.id && (p.team === "home" || p.team === "away")
              && Number.isFinite(p.x) && Number.isFinite(p.y));
            s.annotations = Array.isArray(s.annotations) ? s.annotations.filter(an => {
              if (!an || !s.players.some(p => p.id === an.a)) return false;
              if (typeof an.b === "string") return s.players.some(p => p.id === an.b);
              return !!(an.b && Number.isFinite(an.b.x) && Number.isFinite(an.b.y));
            }) : [];
            s.ball = Object.assign({ x: 50, y: 50, show: false }, s.ball || {});
            s.lastFm = Object.assign({}, s.lastFm || {});
            store[k] = s;
          }
        }
        if (Number.isFinite(d.seq)) seq = d.seq;
        if (store[d.fmt]) fmt = d.fmt;
      }
    } catch (e) {}
  }
  if (!store["11"]) defaultPopulate("11");
  if (!store["8"]) defaultPopulate("8");
  if (!store["5"]) defaultPopulate("5");
  if (fmt !== "11" && fmt !== "8" && fmt !== "5") fmt = "11";
  document.querySelectorAll("#fmtSeg button").forEach(b => b.classList.toggle("active", b.dataset.fmt === fmt));
  restoreState();
  showBallChk.checked = !!ball.show;
  setFmOptions();
  buildPitch();
  renderPlayers(); refreshLines();
  voiceUI(false);
  setOrientation(true);
  requestAnimationFrame(fit);
}
init();
</script>

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
